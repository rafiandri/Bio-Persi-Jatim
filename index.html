    <style>
      :root {
        --bg: #f3f8f5;
        --surface: #ffffff;
        --text: #0a1a10;
        --muted: #4a5d52;
        --line: rgba(0, 64, 32, 0.14);
        --brand: #008040;
        --accent: #1fa35c;
        --glow: rgba(0, 128, 64, 0.18);
        --glass: rgba(255, 255, 255, 0.75);
        --onbrand: #fff;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        height: 100%;
        scroll-behavior: smooth;
        scroll-padding-top: 84px;
      }
      body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Montserrat", system-ui, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .aurora {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .aurora i {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.5;
      }
      .aurora i:nth-child(1) {
        width: 46vmax;
        height: 46vmax;
        left: -14vmax;
        top: -12vmax;
        background: var(--glow);
      }
      .aurora i:nth-child(2) {
        width: 38vmax;
        height: 38vmax;
        right: -12vmax;
        top: 40vh;
        background: rgba(0, 128, 64, 0.14);
      }
      .progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--brand), var(--accent));
        transform-origin: 0 50%;
        z-index: 30;
      }
      .skip {
        position: absolute;
        left: -999px;
        top: 8px;
        background: var(--brand);
        color: var(--onbrand);
        padding: 8px 14px;
        border-radius: 10px;
        z-index: 50;
      }
      .skip:focus {
        left: 12px;
      }
      nav {
        position: sticky;
        top: calc(10px + env(safe-area-inset-top, 0px));
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: fit-content;
        max-width: 94%;
        margin: 10px auto 0;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 12px 30px -16px rgba(11, 31, 77, 0.4);
      }
      nav .links {
        display: flex;
        gap: 2px;
        position: relative;
      }
      nav a {
        position: relative;
        padding: 9px 14px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--muted);
        text-decoration: none;
        z-index: 1;
      }
      nav a.on {
        color: var(--onbrand);
      }
      nav .pill {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--brand);
        z-index: -1;
      }
      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 0 max(var(--pad, 20px), env(safe-area-inset-right, 0px)) 0
          max(var(--pad, 20px), env(safe-area-inset-left, 0px));
      }
      section {
        padding: 56px 0 8px;
      }
      .hero {
        padding-top: 56px;
        text-align: center;
      }
      .logo-ring {
        position: relative;
        width: 124px;
        height: 124px;
        margin: 0 auto 20px;
      }
      .logo-ring .core {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .emb {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 5px;
        display: block;
        border-radius: 50%;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1,
      h2 {
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1.15;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(34px, 10vw, 48px);
        margin: 10px 0 14px;
      }
      h2 {
        font-size: clamp(22px, 6.2vw, 30px);
        margin: 8px 0 12px;
      }
      h1 em,
      h2 em {
        font-style: italic;
        font-weight: 300;
        color: var(--accent);
        padding-right: 0.06em;
      }
      .lead {
        color: var(--muted);
        font-size: 15.5px;
        line-height: 1.65;
        max-width: 420px;
        margin: 0 auto;
      }
      .motto {
        margin: 18px auto 0;
        font:
          italic 400 16px/1.5 "Montserrat",
          sans-serif;
        color: var(--brand);
      }
      .btns {
        display: grid;
        gap: 10px;
        margin-top: 26px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 17px;
        border-radius: 18px;
        font:
          700 14.5px "Montserrat",
          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .btn.p {
        background: var(--brand);
        color: var(--onbrand);
        border: 0;
        box-shadow: 0 14px 30px -12px var(--brand);
      }
      .btn.p::after {
        content: "";
        position: absolute;
        top: 0;
        left: -60%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        transform: skewX(-20deg);
        animation: shine 3.6s infinite;
      }
      @keyframes shine {
        0%,
        55% {
          left: -60%;
        }
        100% {
          left: 140%;
        }
      }
      .btn.s {
        background: var(--glass);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .sub {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
        max-width: 440px;
      }
      .steps {
        display: grid;
        gap: 12px;
        margin-top: 22px;
        position: relative;
      }
      .step {
        display: flex;
        gap: 16px;
        padding: 18px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .num {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        flex: none;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 17px;
        background: var(--brand);
        color: var(--onbrand);
      }
      .step h3,
      .card h3 {
        font-size: 17px;
        margin-bottom: 5px;
      }
      .step p,
      .card p {
        color: var(--muted);
        font-size: 14.5px;
        line-height: 1.6;
      }
      .card {
        padding: 20px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: var(--surface);
        margin-top: 12px;
      }
      .card ul {
        list-style: none;
        padding: 0;
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }
      .card li {
        display: flex;
        gap: 10px;
        font-size: 14.5px;
        color: var(--muted);
        align-items: center;
      }
      .card li::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 12px;
      }
      .stat {
        padding: 16px 8px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--brand);
      }
      .stat span {
        font-size: 11.5px;
        color: var(--muted);
      }
      .notice {
        margin-top: 12px;
        padding: 18px 20px;
        border-radius: 22px;
        border: 1px solid var(--accent);
        background: var(--glow);
      }
      .notice h3 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      .notice p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      .grid2 {
        display: grid;
        gap: 10px;
        margin-top: 22px;
      }
      .tile {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        text-decoration: none;
      }
      .tile .ic {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: var(--glow);
        color: var(--accent);
        font-weight: 800;
        font-size: 14px;
        flex: none;
      }
      .tile strong {
        display: block;
        font-size: 15px;
      }
      .tile small {
        color: var(--muted);
        font-size: 12.5px;
      }
      .tile .ar {
        margin-left: auto;
        color: var(--muted);
      }
      .socials {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      .soc {
        padding: 11px 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--glass);
        color: var(--text);
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 600;
      }
      .rail {
        overflow: hidden;
        margin: 36px calc(-1 * var(--pad, 20px)) 0;
        -webkit-mask-image: linear-gradient(
          90deg,
          transparent,
          #000 12%,
          #000 88%,
          transparent
        );
        mask-image: linear-gradient(
          90deg,
          transparent,
          #000 12%,
          #000 88%,
          transparent
        );
      }
      .track {
        display: flex;
        gap: 10px;
        width: max-content;
        animation: slide 32s linear infinite;
      }
      .rail:hover .track {
        animation-play-state: paused;
      }
      @keyframes slide {
        to {
          transform: translateX(-50%);
        }
      }
      .chip {
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .foot {
        margin: 24px 0 110px;
        padding: 20px 0 0;
        border-top: 1px solid var(--line);
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        line-height: 1.7;
      }
      .foot a {
        color: var(--brand);
        font-weight: 700;
        text-decoration: none;
      }
      .foot a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .ni,
      .brand,
      .navcta {
        display: none;
      }
      /* Navbar mobile: bar tab di bawah layar (mudah dijangkau ibu jari) */
      @media (max-width: 639px) {
        html {
          scroll-padding-top: 16px;
        }
        main {
          padding-bottom: 96px;
        }
        .foot {
          margin: 56px 0 0;
        }
        nav {
          position: fixed;
          top: auto;
          bottom: calc(10px + env(safe-area-inset-bottom, 0px));
          left: max(12px, env(safe-area-inset-left, 0px));
          right: max(12px, env(safe-area-inset-right, 0px));
          width: auto;
          max-width: none;
          margin: 0;
          padding: 6px;
          border-radius: 24px;
          box-shadow: 0 14px 34px -12px rgba(0, 64, 32, 0.45);
        }
        nav .links {
          width: 100%;
          gap: 4px;
        }
        nav a {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 3px;
          min-height: 56px;
          padding: 8px 4px;
          border-radius: 18px;
          font-size: 11.5px;
        }
        nav a.on {
          color: var(--brand);
        }
        nav .pill {
          background: var(--glow);
          border-radius: 18px;
        }
        .ni {
          display: block;
          width: 22px;
          height: 22px;
        }
        .nl {
          font-weight: 700;
          letter-spacing: 0.02em;
        }
      }
      /* Ponsel kecil */
      @media (max-width: 380px) {
        nav a {
          font-size: 10.5px;
        }
        .stat b {
          font-size: 22px;
        }
        .stat span {
          font-size: 10.5px;
        }
        .step {
          padding: 14px;
          gap: 12px;
        }
      }
      /* Tablet portrait & ponsel landscape */
      @media (min-width: 640px) {
        :root {
          --pad: 32px;
        }
        main {
          max-width: 780px;
        }
        .foot {
          margin: 8px 0 260px;
        }
        nav a {
          padding: 10px 20px;
          font-size: 14.5px;
        }
        .hero {
          padding-top: 72px;
        }
        .logo-ring {
          width: 140px;
          height: 140px;
        }
        h1 {
          font-size: clamp(48px, 8vw, 60px);
        }
        h2 {
          font-size: clamp(28px, 4.4vw, 34px);
        }
        .lead {
          font-size: 17px;
          max-width: 520px;
        }
        .btns {
          grid-template-columns: 1fr 1fr;
          max-width: 560px;
          margin-left: auto;
          margin-right: auto;
        }
        .steps {
          grid-template-columns: repeat(3, 1fr);
        }
        .step {
          flex-direction: column;
          gap: 14px;
        }
        .infogrid {
          display: grid;
          grid-template-columns: 1.2fr 1fr;
          gap: 12px;
          align-items: stretch;
        }
        .infogrid .card,
        .infogrid .notice {
          margin-top: 12px;
        }
        .grid2 {
          grid-template-columns: 1fr 1fr;
        }
        section {
          padding-top: 72px;
        }
      }
      /* Tablet landscape & desktop */
      @media (min-width: 1024px) {
        :root {
          --pad: 48px;
        }
        main {
          max-width: 1160px;
        }
        html {
          scroll-padding-top: 96px;
        }
        section {
          padding-top: 96px;
        }
        .hero {
          display: grid;
          grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
          column-gap: 64px;
          align-items: center;
          text-align: left;
          padding-top: 88px;
        }
        .hero > * {
          grid-column: 1;
        }
        .hero .logo-ring {
          grid-column: 2;
          grid-row: 1 / span 7;
          width: min(380px, 100%);
          height: auto;
          aspect-ratio: 1/1;
          margin: 0 auto;
        }
        h1 {
          font-size: clamp(56px, 5.6vw, 76px);
        }
        h2 {
          font-size: 38px;
        }
        .lead,
        .motto {
          margin-left: 0;
          margin-right: 0;
          max-width: 540px;
        }
        .btns,
        .stats {
          margin-left: 0;
          margin-right: 0;
          max-width: 540px;
        }
        .sub {
          max-width: 560px;
          font-size: 16.5px;
        }
        .steps {
          gap: 16px;
        }
        .step {
          padding: 24px;
        }
        .infogrid {
          gap: 16px;
        }
        .grid2 {
          grid-template-columns: repeat(3, 1fr);
          gap: 14px;
        }
        .tile {
          padding: 20px;
        }
        /* Navbar desktop: bar penuh dengan brand, menu, dan tombol */
        nav {
          top: 0;
          width: 100%;
          max-width: none;
          margin: 0;
          border-radius: 0;
          border-width: 0 0 1px;
          padding: 12px max(48px, calc((100vw - 1160px) / 2 + 48px));
          justify-content: space-between;
          gap: 24px;
          box-shadow: none;
          background: var(--glass);
          backdrop-filter: blur(18px);
          -webkit-backdrop-filter: blur(18px);
        }
        nav .brand {
          display: inline-flex;
          gap: 7px;
          align-items: baseline;
          padding: 0;
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 0.08em;
          color: var(--text);
          text-transform: uppercase;
        }
        nav .brand em {
          font-style: italic;
          font-weight: 300;
          color: var(--accent);
        }
        nav .links {
          gap: 6px;
        }
        nav .links a {
          padding: 10px 20px;
        }
        nav a.on {
          color: var(--brand);
        }
        nav .pill {
          background: var(--glow);
        }
        nav .navcta {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 12px 22px;
          border-radius: 999px;
          background: var(--brand);
          color: var(--onbrand);
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          white-space: nowrap;
          transition:
            transform 0.25s,
            box-shadow 0.25s;
        }
        nav .navcta:hover {
          transform: translateY(-2px);
          box-shadow: 0 12px 24px -10px var(--brand);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .track,
        .btn.p::after {
          animation: none;
        }
      }
    </style>

            "Instagram",

              },
              { rootMargin: "-35% 0px -55% 0px" },
            );
            tabs.forEach(function (x) {

        <main>

              </${motion.a}>
              <${motion.a} className="btn s" href="#kontak" whileHover=${{ scale: 1.03 }} whileTap=${{ scale: 0.96 }}>Lihat media sosial</${motion.a}>
            </${motion.div}>
            <${motion.div} className="stats" variants=${item}>
              <div className="stat"><${Counter} to=${750} suffix="+" /><span>Peserta seminar 2019</span></div>

                return html`
                <${motion.div} key=${i} className="step" variants=${item} whileHover=${{ y: -4 }} transition=${{ type: "spring", stiffness: 380, damping: 22 }}>

                  <div><h3>${x[0]}</h3><p>${x[1]}</p></div>
                </${motion.div}>`;
              })}

          </section>

              <${motion.div} className="card" variants=${item}>

                  return html`<span className="chip" key=${i}>${x}</span>`;

          </section>
